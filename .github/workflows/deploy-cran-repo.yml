# Workflow derived from https://github.com/r-wasm/actions/tree/v3/examples
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

name: Build and deploy wasm R package repository

permissions:
  contents: read

concurrency:
  group: wasm-cran-repo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PACKAGE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup R for manifest checks
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install manifest dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite
          pak-version: repo

      # This invokes the same digest-pinned Docker driver as the local
      # clean-commit pre-push rehearsal, preventing CI/local build drift.
      - name: Build and verify wasm package repository
        shell: pwsh
        run: |
          ./tools/wasm/build-wasm-repo.ps1 `
            -PackageSha $env:PACKAGE_SHA `
            -OutDir "_wasm/pinned"

      - name: Upload pinned wasm build artifact
        uses: actions/upload-artifact@v7
        with:
          name: openspecy-wasm-${{ env.PACKAGE_SHA }}
          path: _wasm/pinned
          retention-days: 90
          if-no-files-found: error
